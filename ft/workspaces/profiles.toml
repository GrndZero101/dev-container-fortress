# Profiles with `published_image` match an image that CI publishes from main,
# so `ft workspace pull` can fetch it instead of building it locally.

[tool_layers.gitforge]
description = "Persists GitHub CLI and GitLab CLI state for forge-driven workflows."
mode = "image_build"
build_arg = "WORKSPACE_TOOL_LAYER_GITFORGE"

[tool_layers.secrets]
description = "Installs the first-pass GPG-backed pass secrets baseline."
mode = "image_build"
build_arg = "WORKSPACE_TOOL_LAYER_SECRETS"

[tool_layers.aws]
description = "Persists AWS CLI state and marks the profile for AWS-oriented workflows."
mode = "image_build"
build_arg = "WORKSPACE_TOOL_LAYER_AWS"

[tool_layers.azure]
description = "Persists Azure CLI state and marks the profile for Azure-oriented workflows."
mode = "state_only"

[profiles.ubuntu-base]
description = "Ubuntu-first mounted daily-driver workspace for Dev Fortress development."
container_target = "ubuntu"
working_directory = "/workspace/dev-container-fortress"
persisted_mounts = ["cache", "state", "zoxide", "atuin", "gh", "glab", "aws", "azure"]
tool_layers = []
published_image = "ghcr.io/grndzero101/dev-container-fortress:ubuntu"

[profiles.ubuntu-gitforge]
description = "Ubuntu workspace with forge-oriented persisted state for GitHub and GitLab CLI use."
container_target = "ubuntu"
working_directory = "/workspace/dev-container-fortress"
persisted_mounts = ["cache", "state", "zoxide", "atuin", "gh", "glab"]
tool_layers = ["gitforge"]

[profiles.ubuntu-secrets]
description = "Ubuntu workspace with the first-pass GPG-backed pass secrets baseline."
container_target = "ubuntu"
working_directory = "/workspace/dev-container-fortress"
persisted_mounts = ["cache", "state", "zoxide", "atuin", "gnupg", "password-store"]
tool_layers = ["secrets"]

[profiles.ubuntu-cloud-aws]
description = "Ubuntu workspace with AWS CLI state persistence."
container_target = "ubuntu"
working_directory = "/workspace/dev-container-fortress"
persisted_mounts = ["cache", "state", "zoxide", "atuin", "aws"]
tool_layers = ["aws"]

[profiles.ubuntu-cloud-azure]
description = "Ubuntu workspace with Azure CLI state persistence."
container_target = "ubuntu"
working_directory = "/workspace/dev-container-fortress"
persisted_mounts = ["cache", "state", "zoxide", "atuin", "azure"]
tool_layers = ["azure"]

[profiles.ubuntu-full]
description = "Ubuntu workspace that combines the current optional image-building layers plus cloud state markers."
container_target = "ubuntu"
working_directory = "/workspace/dev-container-fortress"
persisted_mounts = ["cache", "state", "zoxide", "atuin", "gh", "glab", "aws", "azure", "gnupg", "password-store"]
tool_layers = ["gitforge", "secrets", "aws", "azure"]
published_image = "ghcr.io/grndzero101/dev-container-fortress:ubuntu-full"

[profiles.ubuntu-full-rolling]
description = "ubuntu-full on the newest Ubuntu release (Docker's ubuntu:rolling, currently 26.10) for trying a new release with the full toolchain."
container_target = "ubuntu"
working_directory = "/workspace/dev-container-fortress"
persisted_mounts = ["cache", "state", "zoxide", "atuin", "gh", "glab", "aws", "azure", "gnupg", "password-store"]
tool_layers = ["gitforge", "secrets", "aws", "azure"]
os_release = "rolling"
published_image = "ghcr.io/grndzero101/dev-container-fortress:ubuntu-full-rolling"
