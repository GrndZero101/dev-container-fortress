---
- name: Dev Container Fortress host bootstrap
  hosts: "{{ dev_container_fortress_ansible_hosts | default('all') }}"
  gather_facts: true

  vars:
    # `host` converges the full workstation. `workspace` stops after the
    # bootstrap floor and Docker, for a thin host that runs a daily-driver
    # workspace container; `ft host bootstrap --mode workspace` sets it.
    dev_container_fortress_host_mode_effective: >-
      {{ dev_container_fortress_host_mode | default('host') }}
    dev_container_fortress_xdg_config_home_effective: >-
      {{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.config', true) }}
    dev_container_fortress_xdg_cache_home_effective: >-
      {{ ansible_facts['env']['XDG_CACHE_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.cache', true) }}
    dev_container_fortress_xdg_data_home_effective: >-
      {{ ansible_facts['env']['XDG_DATA_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.local/share', true) }}
    dev_container_fortress_xdg_state_home_effective: >-
      {{ ansible_facts['env']['XDG_STATE_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.local/state', true) }}
    dev_container_fortress_shell_config_repo_effective: >-
      {{ dev_container_fortress_shell_config_repo | default('https://github.com/GrndZero101/shell-config.git') }}
    dev_container_fortress_shell_config_branch_effective: >-
      {{ dev_container_fortress_shell_config_branch | default('main') }}
    dev_container_fortress_shell_config_dir_effective: >-
      {{ dev_container_fortress_shell_config_dir | default(dev_container_fortress_xdg_config_home_effective ~ '/shell-config') }}
    dev_container_fortress_shell_config_profile_effective: >-
      {{ dev_container_fortress_shell_config_profile | default('zsh-tll-citadel-dev-fortress') }}
    dev_container_fortress_shell_config_state_file_effective: >-
      {{ dev_container_fortress_xdg_state_home_effective ~ '/shell-config/active-profile' }}
    dev_container_fortress_shell_config_zinit_manage_effective: >-
      {{
        dev_container_fortress_shell_config_zinit_manage
        | default(dev_container_fortress_shell_config_profile_effective == 'zsh-tll-citadel-dev-fortress')
      }}
    dev_container_fortress_shell_config_zinit_home_effective: >-
      {{
        dev_container_fortress_xdg_data_home_effective
        ~ '/shell-config/'
        ~ dev_container_fortress_shell_config_profile_effective
        ~ '/zinit/zinit.git'
      }}
    dev_container_fortress_neovim_kickstart_manage_effective: >-
      {{
        dev_container_fortress_neovim_kickstart_manage
        | default(
            ansible_facts['os_family'] == 'Debian'
            and ansible_facts['distribution'] == 'Ubuntu'
          )
      }}
    dev_container_fortress_neovim_kickstart_repo_effective: >-
      {{ dev_container_fortress_neovim_kickstart_repo | default('https://github.com/nvim-lua/kickstart.nvim.git') }}
    dev_container_fortress_neovim_kickstart_branch_effective: >-
      {{ dev_container_fortress_neovim_kickstart_branch | default('master') }}
    dev_container_fortress_neovim_kickstart_app_name_effective: >-
      {{ dev_container_fortress_neovim_kickstart_app_name | default('nvim-kickstart') }}
    dev_container_fortress_neovim_kickstart_dir_effective: >-
      {{
        dev_container_fortress_neovim_kickstart_dir
        | default(
            dev_container_fortress_xdg_config_home_effective
            ~ '/'
            ~ dev_container_fortress_neovim_kickstart_app_name_effective
          )
      }}
    dev_container_fortress_neovim_kickstart_wrapper_effective: >-
      {{
        dev_container_fortress_neovim_kickstart_wrapper
        | default(ansible_facts['env']['HOME'] ~ '/.local/bin/nvim-kickstart')
      }}
    # Optional components are off unless selected; `ft` renders one boolean per
    # option from `--options`, DEV_CONTAINER_FORTRESS_OPTIONS, or options.toml.
    dev_container_fortress_claude_code_manage_effective: >-
      {{ dev_container_fortress_claude_code_manage | default(false) }}
    dev_container_fortress_claude_code_installer_url_effective: >-
      {{ dev_container_fortress_claude_code_installer_url | default('https://claude.ai/install.sh') }}
    dev_container_fortress_claude_code_launcher_effective: >-
      {{ ansible_facts['env']['HOME'] ~ '/.local/bin/claude' }}
    # The tmux profile is a pick-one option (`tmux-minimal`, `tmux-full`,
    # `tmux-raidboss`); `none` leaves stock tmux with no Dev Fortress config.
    dev_container_fortress_tmux_profile_effective: >-
      {{ dev_container_fortress_tmux_profile | default('none') }}
    # Each profile with the oldest tmux it runs on.
    dev_container_fortress_tmux_profiles:
      minimal: "3.2"
      full: "3.8"
      raidboss: "3.8"
    # Shared with `csm tmux-profile` in shell-config: the profiles directory,
    # and the one link that selects the active profile.
    dev_container_fortress_tmux_profiles_dir_effective: >-
      {{ dev_container_fortress_xdg_data_home_effective ~ '/dev-container-fortress/tmux-profiles' }}
    dev_container_fortress_tmux_conf_effective: >-
      {{ dev_container_fortress_xdg_config_home_effective ~ '/tmux/tmux.conf' }}
    dev_container_fortress_tmux_local_conf_effective: >-
      {{ dev_container_fortress_xdg_config_home_effective ~ '/tmux/local.conf' }}
    dev_container_fortress_tmux_plugins_dir_effective: >-
      {{ dev_container_fortress_xdg_config_home_effective ~ '/tmux/plugins' }}
    dev_container_fortress_tmux_state_file_effective: >-
      {{ dev_container_fortress_xdg_state_home_effective ~ '/dev-container-fortress/tmux-profile' }}
    dev_container_fortress_required_xdg_dirs:
      - "{{ dev_container_fortress_xdg_config_home_effective }}"
      - "{{ ansible_facts['env']['HOME'] }}/.local"
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
      - "{{ dev_container_fortress_xdg_data_home_effective }}"
      - "{{ dev_container_fortress_xdg_state_home_effective }}"
      - "{{ dev_container_fortress_xdg_cache_home_effective }}"
    dev_container_fortress_ubuntu_baseline_packages:
      - ca-certificates
      - curl
      - git
      - python3
      - python3-venv
      - rsync
      - xclip
      - zsh
    dev_container_fortress_alpine_baseline_packages:
      - ca-certificates
      - curl
      - git
      - python3
      - rsync
      - zsh
    dev_container_fortress_arch_baseline_packages:
      - ca-certificates
      - curl
      - git
      - python
      - rsync
      - xclip
      - zsh
    dev_container_fortress_arch_full_upgrade_effective: >-
      {{ dev_container_fortress_arch_full_upgrade | default(true) }}
    dev_container_fortress_arch_reboot_after_kernel_upgrade_effective: >-
      {{
        dev_container_fortress_arch_reboot_after_kernel_upgrade
        | default(dev_fortress_target_kind == 'cloud')
      }}
    dev_container_fortress_ubuntu_homebrew_prerequisite_packages:
      - build-essential
      - procps
      - file
    dev_container_fortress_docker_manage_effective: >-
      {{
        dev_container_fortress_docker_manage
        | default(
            (
              (
                ansible_facts['os_family'] == 'Debian'
                and ansible_facts['distribution'] == 'Ubuntu'
              )
              or ansible_facts['os_family'] == 'Archlinux'
            )
            and dev_fortress_target_kind in ['workstation', 'cloud']
          )
      }}
    dev_container_fortress_docker_apt_prerequisite_packages:
      - ca-certificates
      - curl
      - gnupg
      # Required by ansible.builtin.deb822_repository on the target.
      - python3-debian
    dev_container_fortress_docker_conflicting_packages:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    dev_container_fortress_docker_repo_architecture_map:
      x86_64: amd64
      amd64: amd64
      aarch64: arm64
      arm64: arm64
    dev_container_fortress_docker_repo_architecture_effective: >-
      {{
        dev_container_fortress_docker_repo_architecture_map[
          ansible_facts['architecture']
        ]
        | default(ansible_facts['architecture'])
      }}
    dev_container_fortress_docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    dev_container_fortress_docker_arch_packages:
      - docker
      - docker-buildx
      - docker-compose
    dev_container_fortress_docker_users_effective:
      - "{{ ansible_facts['user_id'] }}"
    dev_container_fortress_docker_daemon_config_effective:
      builder:
        gc:
          enabled: true
          defaultKeepStorage: "20GB"
      log-driver: json-file
      log-opts:
        max-size: "50m"
        max-file: "3"
    dev_container_fortress_native_bootstrap_required_commands:
      - python3
      - git
      - curl
      - zsh
    dev_container_fortress_native_bootstrap_command_packages:
      ubuntu:
        python3: python3
        git: git
        curl: curl
        zsh: zsh
      alpine:
        python3: python3
        git: git
        curl: curl
        zsh: zsh
      arch:
        python3: python
        git: git
        curl: curl
        zsh: zsh
    dev_container_fortress_homebrew_manage_effective: >-
      {{
        dev_container_fortress_homebrew_manage
        | default(
            ansible_facts['os_family'] == 'Debian'
            and ansible_facts['distribution'] == 'Ubuntu'
          )
      }}
    dev_container_fortress_homebrew_prefix_effective: >-
      {{ dev_container_fortress_homebrew_prefix | default('/home/linuxbrew/.linuxbrew') }}
    dev_container_fortress_homebrew_repo_effective: >-
      {{ dev_container_fortress_homebrew_repo | default('https://github.com/Homebrew/brew') }}
    # `latest` resolves to the newest stable `X.Y.Z` tag, as Homebrew's own
    # installer and `brew update` do; any other value is a tag, branch, or commit.
    dev_container_fortress_homebrew_version_effective: >-
      {{ dev_container_fortress_homebrew_version | default('latest') }}
    dev_container_fortress_homebrew_profile_snippet_effective: >-
      {{
        dev_container_fortress_xdg_config_home_effective
        ~ '/dev-container-fortress/profile.d/homebrew.sh'
      }}
    dev_container_fortress_homebrew_linux_packages:
      - atuin
      - bat
      - bats-core
      - btop
      - coreutils
      - duf
      - eza
      - fd
      - fzf
      - git
      - git-delta
      - glow
      - gnupg
      - gopass
      - gum
      - helix
      - jq
      - jsongrep
      - kubernetes-cli
      - lazygit
      - mtr
      - neovim
      - nerdfetch
      - nmap
      - oh-my-posh
      - pass
      - pbzip2
      - ripgrep
      - rustic
      - starship
      - syncthing
      - television
      - tenv
      - tmux
      - tree
      - tree-sitter-cli
      - uv
      - yazi
      - yq
      - zoxide
      - direnv
      - gh
      - glab
      # Companions for the tmux-full and tmux-raidboss profiles: the session
      # picker and the git status segment. Small, and harmless without them.
      - gitmux
      - sesh

  pre_tasks:
    - name: Prove Ansible reachability
      ansible.builtin.ping:

    # Some stock images ship doas instead of sudo, such as Alpine's cloud
    # images. Pick the tool the host has, so every `become: true` task works
    # without installing sudo first. An explicit ansible_become_method wins.
    - name: Find the host's privilege escalation command
      ansible.builtin.shell: command -v sudo || command -v doas
      register: dev_fortress_become_command
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Use doas for become on hosts without sudo
      ansible.builtin.set_fact:
        ansible_become_method: community.general.doas
      when:
        - ansible_become_method is not defined
        - dev_fortress_become_command.stdout | basename == 'doas'

  roles:
    - role: dev_fortress_target_contract
    - role: dev_fortress_xdg_layout
    - role: dev_fortress_ubuntu_base_packages
      when:
        - ansible_facts['os_family'] == 'Debian'
        - ansible_facts['distribution'] == 'Ubuntu'
    - role: dev_fortress_alpine_base_packages
      when:
        - ansible_facts['os_family'] == 'Alpine'
    - role: dev_fortress_arch_base_packages
      when:
        - ansible_facts['os_family'] == 'Archlinux'
    - role: dev_fortress_native_bootstrap_prereqs
    - role: dev_fortress_docker
      when:
        - dev_container_fortress_docker_manage_effective | bool
    # Everything below is the workstation layer, which workspace mode skips.
    - role: dev_fortress_shell_config_bootstrap
      when: dev_container_fortress_host_mode_effective == 'host'
    - role: dev_fortress_shell_config_zinit
      when: dev_container_fortress_host_mode_effective == 'host'
    - role: dev_fortress_login_shell
      when: dev_container_fortress_host_mode_effective == 'host'
    - role: dev_fortress_linuxbrew
      when:
        - dev_container_fortress_host_mode_effective == 'host'
        - dev_container_fortress_homebrew_manage_effective | bool
        - ansible_facts['os_family'] == 'Debian'
        - ansible_facts['distribution'] == 'Ubuntu'
    - role: dev_fortress_neovim_kickstart
      when:
        - dev_container_fortress_host_mode_effective == 'host'
        - dev_container_fortress_neovim_kickstart_manage_effective | bool
    - role: dev_fortress_tmux
      when:
        - dev_container_fortress_host_mode_effective == 'host'
        - dev_container_fortress_tmux_profile_effective != 'none'
    - role: dev_fortress_claude_code
      when:
        - dev_container_fortress_host_mode_effective == 'host'
        - dev_container_fortress_claude_code_manage_effective | bool
    - role: dev_fortress_shell_config_ready
      when: dev_container_fortress_host_mode_effective == 'host'

  # Roles queue anything the operator should act on in a `<role>_notices`
  # list, such as a dotfile moved aside or a config link left alone. Printing
  # them last keeps them out of the task noise.
  post_tasks:
    - name: Report what this run left for you to review
      vars:
        dev_fortress_notices: >-
          {{
            (dev_fortress_shell_config_bootstrap_notices | default([]))
            + (dev_fortress_tmux_notices | default([]))
          }}
      ansible.builtin.debug:
        msg: "{{ dev_fortress_notices }}"
      when: dev_fortress_notices | length > 0
