# gitmux config for catppuccin's gitmux status module. It has to live at
# ~/.gitmux.conf: catppuccin hardcodes `gitmux -cfg $HOME/.gitmux.conf`, and
# gitmux prints nothing at all when that file is missing.
#
# Colours are catppuccin mocha hex values, because gitmux output can carry
# #[...] styles but not #{@thm_*} formats. Change them with @catppuccin_flavor.
tmux:
  symbols:
    # Empty: catppuccin already draws a git icon at the start of the pill.
    branch: ""
    hashprefix: ":"
    ahead: ↑
    behind: ↓
    staged: "● "
    conflict: "✖ "
    modified: "✚ "
    untracked: "… "
    stashed: "⚑ "
    clean: ✔
  styles:
    # gitmux's default "#[none]" would also clear the pill's background
    # mid-segment; resetting only fg keeps catppuccin's surface colour.
    clear: "#[fg=#cdd6f4,nobold]"
    state: "#[fg=#f38ba8,bold]"
    branch: "#[fg=#cdd6f4,bold]"
    remote: "#[fg=#89dceb]"
    divergence: "#[fg=#f9e2af]"
    staged: "#[fg=#a6e3a1,bold]"
    conflict: "#[fg=#f38ba8,bold]"
    modified: "#[fg=#fab387,bold]"
    untracked: "#[fg=#cba6f7,bold]"
    stashed: "#[fg=#89dceb,bold]"
    clean: "#[fg=#a6e3a1,bold]"
    insertions: "#[fg=#a6e3a1]"
    deletions: "#[fg=#f38ba8]"
  # The remote branch name is left out: it's nearly always origin/<branch>
  # and the status line is already busy. stats shows the size of the
  # uncommitted diff, which the file counts in flags don't. No " " separators:
  # gitmux spaces components itself, and literals stay even when their
  # neighbours are empty, leaving trailing blanks in a clean repo's pill.
  layout: [branch, divergence, flags, stats]
  options:
    branch_max_len: 32
    branch_trim: right
    # The flags and stats already say what's dirty; no ✔ when nothing is.
    hide_clean: true
    # Ahead first, spaced apart (↑1 ↓2): ahead is what a push will send.
    swap_divergence: true
    divergence_space: true
