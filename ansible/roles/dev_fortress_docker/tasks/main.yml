---
- name: Assert Docker role only runs on supported targets
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts['os_family'] == 'Debian'
         and ansible_facts['distribution'] == 'Ubuntu')
        or ansible_facts['os_family'] == 'Archlinux'
    fail_msg: >-
      dev_fortress_docker currently supports Ubuntu and Arch Linux targets only.

- name: Assert Docker-managed targets use systemd
  ansible.builtin.assert:
    that:
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: >-
      Docker management currently expects systemd on Ubuntu and Arch
      workstation and cloud targets. For WSL, enable systemd first before
      running Dev Fortress Docker bootstrap.

- name: Install Docker packages on Ubuntu
  ansible.builtin.include_tasks: ubuntu.yml
  when:
    - ansible_facts['os_family'] == 'Debian'
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Install Docker packages on Arch
  ansible.builtin.include_tasks: archlinux.yml
  when:
    - ansible_facts['os_family'] == 'Archlinux'

# In check mode on a host without Docker yet, the services and docker group do
# not exist, so tasks that inspect them can only run after a real install.
- name: Record whether a Docker install is still pending in check mode
  ansible.builtin.set_fact:
    dev_fortress_docker_install_pending: >-
      {{ ansible_check_mode and dev_fortress_docker_packages_result is changed }}

- name: Ensure Docker daemon config directory exists
  become: true
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install managed Docker daemon config
  become: true
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker

- name: Ensure containerd service is enabled and started
  when: not dev_fortress_docker_install_pending | bool
  become: true
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started

- name: Ensure Docker service is enabled and started
  when: not dev_fortress_docker_install_pending | bool
  become: true
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Ensure target users are members of the docker group
  when: not dev_fortress_docker_install_pending | bool
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ dev_container_fortress_docker_users_effective }}"
