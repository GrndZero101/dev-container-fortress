---
- name: Assert Arch targets use a supported architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      Dev Fortress supports Arch Linux on x86_64 only. Arch Linux ARM
      ({{ ansible_facts['architecture'] }}) is not a supported target yet.

# Arch does not support partial upgrades, so refreshing the sync database
# without upgrading can leave installs pointing at packages mirrors no longer
# carry. Upgrade the whole system unless the operator opts out explicitly.
- name: Upgrade Arch packages to the current repository state
  become: true
  community.general.pacman:
    update_cache: true
    upgrade: true
  when: dev_container_fortress_arch_full_upgrade_effective | bool

# A kernel upgrade removes the running kernel's modules, so netfilter and other
# late-loaded modules fail until the host boots the new kernel. Containers do
# not own a kernel, so only real hosts are checked.
- name: Check whether the running kernel's modules are still installed
  ansible.builtin.stat:
    path: "/usr/lib/modules/{{ ansible_facts['kernel'] }}"
  register: dev_fortress_arch_base_packages_running_kernel_modules
  when: dev_fortress_target_kind in ['workstation', 'cloud']

- name: Reboot into the upgraded Arch kernel
  become: true
  ansible.builtin.reboot:
    msg: Dev Fortress is rebooting into the upgraded Arch kernel
  when:
    - dev_fortress_target_kind in ['workstation', 'cloud']
    - not dev_fortress_arch_base_packages_running_kernel_modules.stat.exists
    - dev_container_fortress_arch_reboot_after_kernel_upgrade_effective | bool

- name: Stop until the upgraded Arch kernel is booted
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} upgraded its kernel and no longer has modules for
      the running kernel {{ ansible_facts['kernel'] }}. Reboot the host and
      rerun bootstrap, or set
      dev_container_fortress_arch_reboot_after_kernel_upgrade: true to let
      bootstrap reboot it.
  when:
    - dev_fortress_target_kind in ['workstation', 'cloud']
    - not dev_fortress_arch_base_packages_running_kernel_modules.stat.exists
    - not dev_container_fortress_arch_reboot_after_kernel_upgrade_effective | bool

- name: Ensure Arch baseline packages are present
  become: true
  community.general.pacman:
    name: "{{ dev_container_fortress_arch_baseline_packages }}"
    state: present
