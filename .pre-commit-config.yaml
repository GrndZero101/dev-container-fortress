repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Configured in pyproject.toml; also checks that relative links resolve.
      - id: rumdl
        name: rumdl markdown lint
        entry: uv run rumdl check
        language: system
        types: [markdown]
      # docs/reference/cli.md is generated from the Typer app. Regenerating
      # it here fails the hook whenever the committed copy is out of date.
      - id: cli-reference-render
        name: ft CLI reference is rendered
        entry: uv run typer ft.cli utils docs --name ft --title "ft CLI reference" --output docs/reference/cli.md
        language: system
        files: ^(ft/src/ft/.*\.py|docs/reference/cli\.md)$
        pass_filenames: false
      # TODO.md is generated from the tp task store in .plan/. Regenerating
      # it here fails the hook whenever the committed copy is out of date.
      - id: todo-render
        name: TODO.md is rendered from tp
        entry: scripts/tp-export-todo.sh
        language: system
        files: ^(\.plan/tasks\.jsonl|TODO\.md)$
        pass_filenames: false
      # The devcontainer definitions are rendered from ft's runtime data.
      - id: devcontainer-render
        name: devcontainer definitions are rendered
        entry: uv run ft devcontainer render --check
        language: system
        files: ^(\.devcontainer/.*|devcontainer/.*|containers/[^/]+/Dockerfile|ft/src/ft/(container_runtime|container_targets|devcontainer|options)\.py)$
        pass_filenames: false
      - id: workbench-example-render
        name: example workbench is rendered
        entry: uv run ft workbench render examples/workbench/example.toml --check
        language: system
        files: ^(examples/workbench/.*|ft/workspaces/profiles\.toml|ft/src/ft/(container_runtime|devcontainer|options|workbench)\.py)$
        pass_filenames: false
      - id: ansible-playbook-syntax
        name: ansible playbook syntax
        entry: zsh -lc 'ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg" ANSIBLE_LOCAL_TEMP=/tmp/dev-fortress-ansible-local ANSIBLE_REMOTE_TEMP=/tmp/dev-fortress-ansible-remote uv run ansible-playbook --syntax-check ansible/playbooks/host.yml'
        language: system
        files: ^ansible/.*\.(yml|yaml)$
        pass_filenames: false
      - id: ansible-lint
        name: ansible lint
        entry: zsh -lc 'ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg" uv run ansible-lint ansible'
        language: system
        files: ^ansible/.*\.(yml|yaml)$
        pass_filenames: false
      - id: zsh-syntax
        name: zsh syntax
        entry: zsh -n
        language: system
        files: ^(bootstrap\.zsh|scripts/.*\.zsh|infra/.*\.zsh)$
      - id: sh-syntax
        name: sh syntax
        entry: sh -n
        language: system
        files: ^(install\.sh|containers/common/.*\.sh)$
        exclude: ^containers/common/(brew-floor|ensure-claude-code)\.sh$
      # Container helpers that run under bash in every image.
      - id: bash-syntax
        name: bash syntax
        entry: bash -n
        language: system
        files: ^containers/common/(brew-floor|ensure-claude-code)\.sh$
