[project]
name = "dev-container-fortress"
version = "0.1.0"
description = "Provisioning and packaging workspace for portable developer environments."
requires-python = ">=3.14"
dependencies = [
  "ft",
  "prompt-toolkit>=3.0.51",
]

[dependency-groups]
dev = [
  "ansible>=11.4.0",
  "ansible-lint>=25.4.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.5",
  "ruff>=0.11.4",
]

[tool.uv]
# Only ever run on the uv-managed Python that .python-version pins, never a
# distro or Homebrew Python, so every host runs the same interpreter.
python-preference = "only-managed"

[tool.uv.sources]
ft = { workspace = true }

[tool.uv.workspace]
members = ["ft"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# Explicit rule set so ruff upgrades do not silently change the default rules.
select = ["E4", "E7", "E9", "F", "B", "I", "SIM", "UP"]
ignore = [
  # Typer options compute their defaults through function calls by design.
  "B008",
  # Nested ternaries read worse than the explicit if/else blocks they replace.
  "SIM108",
]

[tool.pytest.ini_options]
testpaths = ["ft/tests"]
